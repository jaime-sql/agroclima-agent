[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agroclima-agent"
version = "0.1.0"
description = "Coffee leaf rust agent for El Salvador on Nebius Token Factory"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jaime Garcia" }]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pillow>=11",
  "pydantic>=2",
  "python-multipart>=0.0.9",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agroclima = "agroclima_agent.__main__:main"
agroclima-nightly = "agroclima_agent.jobs.nightly:main"
agroclima-alerts = "agroclima_agent.jobs.refresh_alerts:main"
agroclima-eval = "agroclima_agent.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agroclima_agent = ["data/*.json", "web/static/*"]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
