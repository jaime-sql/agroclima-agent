<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgroClima Agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%231e5b2a' d='M16 3c1.2 6 6.5 8.2 10 12-5 1.6-8 6.4-10 14C14.2 21.4 9 16.6 6 15 9.2 11.2 14.6 9 16 3z'/%3E%3C/svg%3E" />
  <style>
    :root {
      --ink: #1c2416;
      --muted: #5c684f;
      --paper: #f6f1e6;
      --card: #fffdf8;
      --line: #e2d8c6;
      --green: #1e5b2a;
      --green-soft: #e5f2e4;
      --amber: #6b4b00;
      --amber-soft: #fff1c2;
      --red: #8a1c14;
      --red-soft: #fde2e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.45;
    }
    header, main { max-width: 880px; margin: 0 auto; padding: 24px 20px; }
    header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 12px;
      padding-bottom: 0;
    }
    h1 { font-size: 1.8rem; margin: 0 0 4px; letter-spacing: -0.02em; }
    .lede { color: var(--muted); margin: 0 0 12px; }
    .flow { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
    .flow span {
      background: var(--green-soft);
      color: var(--green);
      border-radius: 999px;
      padding: 4px 10px;
      font-weight: 650;
    }
    .lang {
      display: flex;
      border: 1px solid var(--green);
      border-radius: 999px;
      overflow: hidden;
      background: white;
    }
    .lang button {
      width: auto;
      background: transparent;
      color: var(--green);
      border: 0;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 700;
    }
    .lang button[aria-pressed="true"] { background: var(--green); color: white; }
    #banner { grid-column: 1 / -1; }
    .banner {
      background: var(--amber-soft);
      color: var(--amber);
      border-radius: 12px;
      padding: 12px 14px;
      margin: 12px 0 18px;
    }
    form, article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label { display: block; font-weight: 650; margin-bottom: 6px; }
    select, textarea, button { width: 100%; font: inherit; }
    select, textarea {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: white;
      margin-bottom: 14px;
    }
    textarea { min-height: 72px; }
    button {
      background: var(--green);
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .file-row { margin-bottom: 14px; }
    #photo-button {
      min-height: 44px;
      width: 100%;
      background: white;
      color: var(--green);
      border: 1px dashed var(--green);
    }
    .file-name { color: var(--muted); display: block; margin-top: 6px; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
    .step { margin-bottom: 14px; }
    .step h2 { margin: 0 0 6px; font-size: 1.15rem; }
    .meta { color: var(--muted); font-size: 0.8rem; margin: 8px 0 0; }
    details.tech summary { font-size: 0.8rem; color: var(--muted); cursor: pointer; }
    .farmer {
      font-family: inherit;
      font-size: 1.05rem;
      line-height: 1.55;
      background: var(--green-soft);
      border-radius: 12px;
      padding: 12px 14px;
      white-space: pre-wrap;
    }
    .level {
      display: inline-block;
      font-weight: 800;
      font-size: 1rem;
      padding: 4px 12px;
      border-radius: 999px;
      margin: 0 0 8px;
    }
    .level.alto { background: var(--red-soft); color: var(--red); }
    .level.medio { background: var(--amber-soft); color: var(--amber); }
    .level.bajo { background: var(--green-soft); color: var(--green); }
    .badge {
      display: inline-block;
      font-family: "Segoe UI", sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 2px 8px;
      margin-left: 6px;
      background: var(--amber-soft);
      color: var(--amber);
    }
    ul { padding-left: 18px; }
    a { color: var(--green); }
    footer { color: var(--muted); font-size: 0.85rem; margin-top: 24px; }
    .days { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .day { min-width: 72px; border-radius: 10px; padding: 8px; background: #eee; font-size: 0.85rem; }
    .day.alto { background: var(--red-soft); color: var(--red); }
    .day.medio { background: var(--amber-soft); color: var(--amber); }
    .day.bajo { background: var(--green-soft); color: var(--green); }
    .day.sin-datos { background: #eee; color: #5c684f; }
    .trust { color: #6e6a64; font-size: 0.95rem; margin: 10px 0 0; }
    .orientation {
      display: inline-block;
      background: #efece6;
      color: #5c684f;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.85rem;
      margin: 10px 0 0;
    }
    a.consult {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      width: auto;
      margin-top: 12px;
      background: white;
      color: var(--green);
      border: 1px solid var(--green);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      text-decoration: none;
    }
    @media (max-width: 480px) {
      header, main { padding: 16px 14px; }
      h1 { font-size: 1.45rem; }
      form, article { padding: 14px; border-radius: 14px; }
      .days { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
      .day { min-width: 0; text-align: center; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AgroClima Agent</h1>
      <p id="tagline" class="lede">Guía de roya del café para productores de El Salvador.</p>
      <div id="flow" class="flow"></div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-es" aria-pressed="true">ES</button>
      <button type="button" id="lang-en" aria-pressed="false">EN</button>
    </div>
    <div id="banner" class="banner" hidden></div>
  </header>
  <main>
    <form id="run-form">
      <input type="hidden" name="language" id="language" value="es" />
      <label id="department-label" for="department"></label>
      <select id="department" name="department" required></select>
      <label id="photo-label" for="photo-button"></label>
      <div class="file-row">
        <button type="button" id="photo-button"></button>
        <span id="photo-name" class="file-name"></span>
        <input id="photo" class="visually-hidden" name="photo" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" />
      </div>
      <label id="question-label" for="question"></label>
      <textarea id="question" name="question" maxlength="500"></textarea>
      <button type="submit" id="submit"></button>
      <p id="status" class="meta" role="status"></p>
    </form>
    <div id="results"></div>
    <section id="tecnico">
      <h2 id="consult-tecnico"></h2>
      <p id="tecnico-body"></p>
      <p><a href="https://www.centa.gob.sv/">CENTA</a></p>
    </section>
    <footer id="disclaimer"></footer>
  </main>
  <script>
    const STR = {
      es: {
        tagline: "Guía de roya del café para productores de El Salvador.",
        consult: "Consultar a un técnico",
        consultBody: "Para una visita, comuníquese con el técnico de su cooperativa o de la oficina agrícola más cercana.",
        disclaimer: "Los umbrales de riesgo son una estimación propia y no están validados por el ISC, CENTA ni el MAG. La lectura de la hoja es una orientación, no un diagnóstico.",
        department: "Departamento",
        photo: "Foto de la hoja (opcional)",
        photoButton: "Elegir foto",
        photoEmpty: "Ningún archivo elegido",
        question: "Su pregunta (opcional)",
        placeholder: "Ej.: ¿Conviene revisar el cafetal esta semana?",
        submit: "Ver plan de la semana",
        running: "Revisando clima, alertas y hoja…",
        failed: "Algo falló. Intente de nuevo.",
        error: "Algo falló. Intente de nuevo.",
        mock: "Modo demostración: algunas respuestas son ejemplos.",
        badge: "Prueba",
        sample: " (ejemplo)",
        official: " (fuente oficial)",
        stale: " (sin actualizar)",
        details: "Detalles técnicos",
        orient: "Orientativo — no es un diagnóstico",
        risk: "Riesgo",
        nodata: "Sin datos",
        levels: { alto: "ALTO", medio: "MEDIO", bajo: "BAJO" },
        days: { alto: "Alto", medio: "Medio", bajo: "Bajo" },
        steps: { clima: "1 Clima", alertas: "2 Alertas oficiales", diagnostico: "3 Hoja", plan: "4 Plan" }
      },
      en: {
        tagline: "Coffee leaf rust guide for El Salvador growers.",
        consult: "Consult a technician",
        consultBody: "For a visit, contact the technician at your cooperative or the nearest farm office.",
        disclaimer: "Risk thresholds are our own estimate, not validated by ISC, CENTA or MAG. The leaf reading is guidance, not a diagnosis.",
        department: "Department",
        photo: "Leaf photo (optional)",
        photoButton: "Choose photo",
        photoEmpty: "No file selected",
        question: "Your question (optional)",
        placeholder: "E.g. Should I check the farm this week?",
        submit: "Get this week's plan",
        running: "Checking weather, alerts and leaf…",
        failed: "Something went wrong. Try again.",
        error: "Something went wrong. Try again.",
        mock: "Demo mode: some replies are samples.",
        badge: "Sample",
        sample: " (sample)",
        official: " (official source)",
        stale: " (not updated)",
        details: "Technical details",
        orient: "Guidance only — not a diagnosis",
        risk: "risk",
        nodata: "No data",
        levels: { alto: "HIGH", medio: "MEDIUM", bajo: "LOW" },
        days: { alto: "High", medio: "Medium", bajo: "Low" },
        steps: { clima: "1 Weather", alertas: "2 Official alerts", diagnostico: "3 Leaf", plan: "4 Plan" }
      }
    };

    const banner = document.querySelector("#banner");
    const select = document.querySelector("#department");
    const form = document.querySelector("#run-form");
    const results = document.querySelector("#results");
    const status = document.querySelector("#status");
    const submit = document.querySelector("#submit");
    const photo = document.querySelector("#photo");
    const photoButton = document.querySelector("#photo-button");
    const photoName = document.querySelector("#photo-name");
    const languageInput = document.querySelector("#language");
    let lang = localStorage.getItem("agroclima-lang") === "en" ? "en" : "es";
    let health = null;
    let lastBody = null;

    function textOf(id) { return STR[lang][id]; }

    function applyLanguage(next) {
      lang = next === "en" ? "en" : "es";
      localStorage.setItem("agroclima-lang", lang);
      document.documentElement.lang = lang;
      languageInput.value = lang;
      document.querySelector("#lang-es").setAttribute("aria-pressed", lang === "es" ? "true" : "false");
      document.querySelector("#lang-en").setAttribute("aria-pressed", lang === "en" ? "true" : "false");
      document.querySelector("#tagline").textContent = textOf("tagline");
      const flow = document.querySelector("#flow");
      flow.replaceChildren();
      for (const id of ["clima", "alertas", "diagnostico", "plan"]) {
        flow.appendChild(el("span", "", STR[lang].steps[id]));
      }
      document.querySelector("#consult-tecnico").textContent = textOf("consult");
      document.querySelector("#tecnico-body").textContent = textOf("consultBody");
      document.querySelector("#disclaimer").textContent = textOf("disclaimer");
      document.querySelector("#department-label").textContent = textOf("department");
      document.querySelector("#photo-label").textContent = textOf("photo");
      photoButton.textContent = textOf("photoButton");
      if (!photo.files || !photo.files.length) photoName.textContent = textOf("photoEmpty");
      document.querySelector("#question-label").textContent = textOf("question");
      document.querySelector("#question").placeholder = textOf("placeholder");
      submit.textContent = textOf("submit");
      if (health && health.mock) banner.textContent = textOf("mock");
      if (lastBody) render(lastBody);
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function visibleModel(id) {
      return id && id.indexOf("nvidia/") === 0 ? id : "";
    }

    photoButton.addEventListener("click", () => photo.click());
    photo.addEventListener("change", () => {
      photoName.textContent = photo.files && photo.files.length ? photo.files[0].name : textOf("photoEmpty");
    });
    document.querySelector("#lang-es").addEventListener("click", () => applyLanguage("es"));
    document.querySelector("#lang-en").addEventListener("click", () => applyLanguage("en"));

    fetch("/api/health").then((response) => response.json()).then((body) => {
      health = body;
      if (!health.mock) return;
      banner.hidden = false;
      banner.textContent = textOf("mock");
    });

    fetch("/api/departments").then((response) => response.json()).then((body) => {
      for (const name of body.departments) {
        const option = el("option", "", name);
        option.value = name;
        if (name === "Santa Ana") option.selected = true;
        select.appendChild(option);
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submit.disabled = true;
      status.textContent = textOf("running");
      results.replaceChildren();
      lastBody = null;
      try {
        const response = await fetch("/api/run", { method: "POST", body: new FormData(form) });
        const body = await response.json();
        if (!response.ok) {
          const detail = body && body.detail;
          status.textContent = typeof detail === "string" ? detail : textOf("failed");
          return;
        }
        lastBody = body;
        status.textContent = body.status || textOf("submit");
        render(body);
      } catch (error) {
        status.textContent = textOf("error");
      } finally {
        submit.disabled = false;
      }
    });

    function render(body) {
      results.replaceChildren();
      const copy = STR[lang];
      const shared = body.steps.find((step) => step.detail && step.detail.consult_href);
      const sharedHref = shared ? shared.detail.consult_href : "#tecnico";
      const sharedLabel = shared && shared.detail.consult_label ? shared.detail.consult_label : copy.consult;
      for (const step of body.steps) {
        const card = el("article", "step");
        const detail = step.detail || {};
        if (step.id === "clima" && detail.worst && copy.levels[detail.worst]) {
          const word = copy.levels[detail.worst];
          const risk = el("p", "level " + detail.worst, lang === "en" ? word + " " + copy.risk : copy.risk + " " + word);
          card.appendChild(risk);
        }
        const title = el("h2", "", copy.steps[step.id] || step.title);
        if (step.mock) title.appendChild(el("span", "badge", copy.badge));
        card.appendChild(title);
        const bits = [];
        const model = visibleModel(step.model_id);
        if (model) bits.push(model);
        if (step.latency_ms != null) bits.push(step.latency_ms + " ms");
        if (step.tokens && step.tokens.total_tokens != null) bits.push(step.tokens.total_tokens + " tokens");
        if (step.input_sha256) bits.push(step.input_sha256.slice(0, 12));
        card.appendChild(el("div", "farmer", step.farmer_text));
        if (bits.length || detail.trust_sentence) {
          const tech = el("details", "tech");
          const summary = el("summary", "", copy.details);
          tech.appendChild(summary);
          if (bits.length) tech.appendChild(el("p", "meta", bits.join(" · ")));
          // Accuracy and recall figures live only inside Detalles técnicos.
          if (detail.trust_sentence) tech.appendChild(el("p", "trust", detail.trust_sentence));
          card.appendChild(tech);
        }
        if (step.id === "diagnostico") {
          card.appendChild(el("p", "orientation", detail.orientation_tag || copy.orient));
        }
        if (step.id === "diagnostico" || step.id === "plan") {
          const consult = el("a", "consult", step.id === "diagnostico" && detail.consult_label ? detail.consult_label : sharedLabel);
          consult.href = detail.consult_href || sharedHref;
          if (consult.href !== "#tecnico") {
            consult.target = "_blank";
            consult.rel = "noopener noreferrer";
          }
          card.appendChild(consult);
        }
        const days = detail.days;
        if (Array.isArray(days) && days.length) {
          const row = el("div", "days");
          for (const day of days) {
            const level = day.level || "";
            const parts = String(day.date || "").split("-");
            const shown = level ? copy.days[level] + " " + parts[2] + "/" + parts[1] : copy.nodata;
            const chip = el("div", "day " + (level || "sin-datos"), shown);
            chip.setAttribute("aria-label", day.date || shown);
            row.appendChild(chip);
          }
          card.appendChild(row);
        }
        if (step.citations && step.citations.length) {
          const list = el("ul");
          for (const cite of step.citations) {
            const item = el("li");
            const link = el("a", "", cite.title);
            link.href = cite.url;
            link.rel = "noopener noreferrer";
            link.target = "_blank";
            item.appendChild(link);
            const flag = cite.stale ? copy.stale : cite.mock ? copy.sample : cite.official ? copy.official : "";
            item.appendChild(document.createTextNode(flag));
            if (cite.snippet) item.appendChild(el("div", "meta", cite.snippet));
            list.appendChild(item);
          }
          card.appendChild(list);
        }
        results.appendChild(card);
      }
    }

    applyLanguage(lang);
  </script>
</body>
</html>
